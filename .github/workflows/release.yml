name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v10.2.0

      - id: release-tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: scripts/parse-release-tag.py "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.release-tag.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release-tag.outputs.version }}
            type=raw,value=${{ steps.release-tag.outputs.upstream }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7.4.0
        with:
          context: images/${{ steps.release-tag.outputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
